# Render Blueprint: 백엔드 웹 서비스 (Docker). 대시보드에서 New → Blueprint 로 이 파일을 고르면 된다.
# 비밀값(ANTHROPIC_API_KEY, BACKEND_JWT_SECRET)은 대시보드에서 직접 입력한다.
services:
  - type: web
    name: bitamin-backend
    runtime: docker
    plan: free            # free 는 15분 유휴 시 잠들고 디스크가 없어 SQLite 가 재배포 때 초기화됨. 시연 때는 starter 권장
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BACKEND_ENVIRONMENT
        value: production
      - key: BACKEND_ALLOWED_ORIGINS
        value: https://YOUR-FRONTEND.vercel.app   # Vercel 주소로 바꾼다 (쉼표로 여러 개)
      - key: BACKEND_JWT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: BACKEND_QUESTION_MAX_CONCURRENCY
        value: "2"
    # 유료 플랜이면 아래 주석을 풀어 SQLite 를 유지한다
    # disk:
    #   name: backend-data
    #   mountPath: /app/backend/data
    #   sizeGB: 1
